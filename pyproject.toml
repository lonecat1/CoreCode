[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode"
version = "0.1.0"
description = "A lightweight terminal coding assistant: a Claude Code-like agent loop, ported to Python."
readme = "README.md"
requires-python = ">=3.11"
# 刻意保持零运行时依赖：终端交互与协议适配全部手写。
# 这条约束来自 TypeScript 版本（只依赖 diff 与 zod），它让核心循环保持可通读。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
minicode = "minicode.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
