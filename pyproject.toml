[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corecode"
version = "0.1.0"
description = "A terminal coding agent with tool use, skills, long-term memory and layered context compaction."
readme = "README.md"
requires-python = ">=3.11"
# 刻意保持零运行时依赖：终端交互、HTTP、HTML 抽取、JSONL 全部用标准库手写。
# 这条约束让核心循环保持可通读，也让安装与分发不依赖网络。
dependencies = []

[project.optional-dependencies]
# 可选工具，不是运行前提。缺了它们也能跑，只是少了静态检查。
dev = ["pytest>=8.0.0"]

[project.scripts]
corecode = "corecode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
