[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode"
version = "0.1.0"
description = "A lightweight terminal coding assistant: a Claude Code-like agent loop, written in Python."
readme = "README.md"
requires-python = ">=3.11"
# 刻意保持零运行时依赖：终端交互、HTTP、HTML 抽取、JSONL 全部用标准库手写。
# 这条约束沿用自 TypeScript 版（只依赖 diff 与 zod），它让核心循环保持可通读。
dependencies = []

[project.optional-dependencies]
# 可选工具，不是运行前提。缺了它们也能跑，只是少了静态检查。
dev = ["pytest>=8.0.0"]

[project.scripts]
minicode = "minicode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
